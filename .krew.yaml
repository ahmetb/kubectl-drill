apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: drill
spec:
  version: {{ .TagName }}
  homepage: https://github.com/ahmetb/kubectl-drill
  shortDescription: Drill into resource labels and annotations
  description: |
    A kubectl plugin to drill into Kubernetes resource labels and
    annotations: which keys exist across a set of resources, their
    cardinality and coverage, how values are distributed, and what makes
    individual resources different. Opens an interactive terminal
    drill-down (prefix > key > value > resource) by default; a --boring
    flag prints static, scriptable tables.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://github.com/ahmetb/kubectl-drill/releases/download/{{ .TagName }}/kubectl-drill_{{ .TagName }}_darwin_amd64.tar.gz" .TagName }}
    bin: kubectl-drill
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://github.com/ahmetb/kubectl-drill/releases/download/{{ .TagName }}/kubectl-drill_{{ .TagName }}_darwin_arm64.tar.gz" .TagName }}
    bin: kubectl-drill
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha "https://github.com/ahmetb/kubectl-drill/releases/download/{{ .TagName }}/kubectl-drill_{{ .TagName }}_linux_amd64.tar.gz" .TagName }}
    bin: kubectl-drill
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{addURIAndSha "https://github.com/ahmetb/kubectl-drill/releases/download/{{ .TagName }}/kubectl-drill_{{ .TagName }}_linux_arm64.tar.gz" .TagName }}
    bin: kubectl-drill
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{addURIAndSha "https://github.com/ahmetb/kubectl-drill/releases/download/{{ .TagName }}/kubectl-drill_{{ .TagName }}_windows_amd64.tar.gz" .TagName }}
    bin: kubectl-drill.exe
