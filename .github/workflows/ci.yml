name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Test
      run: go test ./...
    - name: Vet
      run: go vet ./...
    - name: Format
      run: |
        unformatted=$(gofmt -l .)
        if [[ -n "$unformatted" ]]; then
          echo "gofmt needed on: $unformatted"
          exit 1
        fi
    - name: E2E
      run: hack/e2e.sh
  goreleaser:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        version: '~> v2'
        args: release --snapshot --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
