version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: chore
    include: scope

- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: chore
    include: scope
  groups:
    kubernetes:
      patterns:
        - "k8s.io/*"
  ignore:
    # tablewriter v1.x is a different API; v0.0.5 is pinned intentionally
  - dependency-name: github.com/olekukonko/tablewriter
    update-types:
    - version-update:semver-major
